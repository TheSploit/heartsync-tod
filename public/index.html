<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartSync - Game Ular Tangga Pasangan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8 font-sans relative">

  <!-- TOMBOL AKSES DEVELOPER / ADMIN (POJOK KANAN ATAS) -->
  <a href="/dev-dashboard.html" 
     title="Developer Dashboard" 
     class="fixed top-4 right-4 z-50 bg-slate-900/90 hover:bg-slate-800 text-slate-400 hover:text-rose-400 p-2.5 rounded-full border border-slate-800 backdrop-blur-md shadow-xl transition-all duration-300 flex items-center justify-center w-11 h-11 group">
    <i class="fa-solid fa-user-shield text-base group-hover:scale-110 transition-transform"></i>
  </a>

  <!-- Header / Hero Section -->
  <header class="max-w-md mx-auto text-center mt-6 space-y-3">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold">
      <i class="fa-solid fa-heart animate-pulse"></i> Special Edition Couple Game
    </div>
    <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-pink-600">
      HeartSync Pro
    </h1>
    <p class="text-xs md:text-sm text-slate-400">
      Uji seberapa kompak kamu dan pasanganmu lewat permainan ular tangga interaktif dengan tantangan seru!
    </p>
  </header>

  <!-- Form Room & Player Join -->
  <main class="max-w-md mx-auto w-full my-auto space-y-6 bg-slate-900/60 border border-slate-800 p-6 rounded-3xl backdrop-blur-xl shadow-2xl">
    <form id="join-form" class="space-y-4">
      
      <!-- Input Nama -->
      <div class="space-y-1.5">
        <label for="player-name" class="text-xs font-semibold text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-user text-rose-400"></i> Nama Kamu
        </label>
        <input type="text" id="player-name" placeholder="Masukkan nama panggilanmu" required
               class="w-full bg-slate-800/80 border border-slate-700/80 px-4 py-3 rounded-2xl text-sm text-white focus:outline-none focus:border-rose-500 transition-all">
      </div>

      <!-- Input Kode Room -->
      <div class="space-y-1.5">
        <label for="room-id" class="text-xs font-semibold text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-key text-rose-400"></i> Kode Room Pasangan
        </label>
        <input type="text" id="room-id" placeholder="Contoh: LOVE12" required uppercase
               class="w-full bg-slate-800/80 border border-slate-700/80 px-4 py-3 rounded-2xl text-sm font-bold tracking-wider text-rose-400 placeholder:font-normal focus:outline-none focus:border-rose-500 transition-all uppercase">
      </div>

      <!-- Pilih Avatar -->
      <div class="space-y-2">
        <label class="text-xs font-semibold text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-face-smile text-rose-400"></i> Pilih Avatar Karakter
        </label>
        <div class="grid grid-cols-5 gap-2" id="avatar-selector">
          <button type="button" data-avatar="🧸" class="avatar-btn bg-slate-800 border-2 border-rose-500 rounded-2xl p-2.5 text-2xl hover:scale-105 transition-all">🧸</button>
          <button type="button" data-avatar="🐰" class="avatar-btn bg-slate-800 border-2 border-transparent rounded-2xl p-2.5 text-2xl hover:scale-105 transition-all">🐰</button>
          <button type="button" data-avatar="🐱" class="avatar-btn bg-slate-800 border-2 border-transparent rounded-2xl p-2.5 text-2xl hover:scale-105 transition-all">🐱</button>
          <button type="button" data-avatar="🦊" class="avatar-btn bg-slate-800 border-2 border-transparent rounded-2xl p-2.5 text-2xl hover:scale-105 transition-all">🦊</button>
          <button type="button" data-avatar="🐼" class="avatar-btn bg-slate-800 border-2 border-transparent rounded-2xl p-2.5 text-2xl hover:scale-105 transition-all">🐼</button>
        </div>
      </div>

      <!-- Tombol Masuk Game -->
      <button type="submit" 
              class="w-full bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-rose-500/25 transition-all duration-300 flex items-center justify-center gap-2 text-sm">
        <i class="fa-solid fa-gamepad"></i> Masuk Arenaku
      </button>

    </form>
  </main>

  <!-- Footer Link ke Developer Dashboard -->
  <footer class="max-w-md mx-auto text-center space-y-2 py-4">
    <p class="text-xs text-slate-500">&copy; HeartSync Pro - Buat Momen Manis Bersama Pasangan</p>
    <div>
      <a href="/dev-dashboard.html" class="inline-flex items-center gap-1.5 text-[11px] text-slate-600 hover:text-rose-400 transition-colors">
        <i class="fa-solid fa-code"></i> Developer Dashboard & Telemetry
      </a>
    </div>
  </footer>

  <script>
    let selectedAvatar = '🧸';

    // Handler Pilihan Avatar
    document.querySelectorAll('.avatar-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.avatar-btn').forEach(b => {
          b.classList.remove('border-rose-500');
          b.classList.add('border-transparent');
        });
        btn.classList.remove('border-transparent');
        btn.classList.add('border-rose-500');
        selectedAvatar = btn.getAttribute('data-avatar');
      });
    });

    // Submit Form
    document.getElementById('join-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const playerName = document.getElementById('player-name').value.trim();
      const roomId = document.getElementById('room-id').value.trim().toUpperCase();

      if (!playerName || !roomId) return;

      // Simpan preferensi sementara di localStorage
      localStorage.setItem('hs_playerName', playerName);
      localStorage.setItem('hs_roomId', roomId);
      localStorage.setItem('hs_avatar', selectedAvatar);

      // Redirect ke halaman arena permainan
      window.location.href = `/game.html?room=${roomId}&name=${encodeURIComponent(playerName)}&avatar=${encodeURIComponent(selectedAvatar)}`;
    });
  </script>
</body>
</html>
