<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartSync 💕 - ToD LDR Edition</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-rose-100 via-pink-50 to-rose-200 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white/80 backdrop-blur-md rounded-3xl shadow-2xl border border-rose-200/50 p-6 transition-all duration-300">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-rose-600 tracking-tight flex items-center justify-center gap-2">
        HeartSync <i class="fa-solid fa-heart animate-pulse text-rose-500"></i>
      </h1>
      <p class="text-xs text-rose-400 font-medium mt-1">Truth or Dare for Distance Lovers</p>
    </div>

    <!-- Section 1: Join Room -->
    <div id="login-sec" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">NAMA KAMU</label>
        <input type="text" id="username" placeholder="misal: Ayang" 
          class="w-full px-4 py-3 rounded-xl bg-rose-50/50 border border-rose-200 text-gray-700 focus:outline-none focus:ring-2 focus:ring-rose-400">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">KODE ROOM</label>
        <input type="text" id="room-id" placeholder="misal: KITA2026" 
          class="w-full px-4 py-3 rounded-xl bg-rose-50/50 border border-rose-200 text-gray-700 focus:outline-none focus:ring-2 focus:ring-rose-400 uppercase">
      </div>
      <button onclick="joinRoom()" 
        class="w-full py-3.5 bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold rounded-xl shadow-lg shadow-rose-300 transition-all active:scale-95">
        Masuk Arena <i class="fa-solid fa-arrow-right ml-1"></i>
      </button>
    </div>

    <!-- Section 2: Game Area -->
    <div id="game-sec" class="hidden space-y-4">
      
      <!-- Info Room -->
      <div class="flex items-center justify-between bg-rose-50/80 p-3 rounded-2xl border border-rose-100">
        <div>
          <span class="text-[10px] font-bold text-rose-400 uppercase block">KODE ROOM</span>
          <span id="room-display" class="font-bold text-gray-800 text-sm"></span>
        </div>
        <div class="text-right">
          <span class="text-[10px] font-bold text-rose-400 uppercase block">PEMAIN</span>
          <span id="players-list" class="text-xs font-medium text-gray-600"></span>
        </div>
      </div>

      <!-- Display Kartu ToD -->
      <div id="card-wrapper" class="relative">
        <div id="card-box" class="w-full min-h-[220px] bg-gradient-to-br from-white to-rose-50/60 rounded-2xl border-2 border-rose-200 p-6 flex flex-col justify-between items-center text-center shadow-lg transition-all duration-300">
          
          <span id="card-category" class="px-3 py-1 bg-rose-100 text-rose-600 text-[11px] font-extrabold rounded-full uppercase">
            [Siap Main?]
          </span>

          <div class="my-3">
            <h3 id="card-title" class="text-sm font-semibold text-gray-400 mb-1">Pilih giliranmu!</h3>
            <p id="card-text" class="text-gray-800 font-medium leading-relaxed italic text-base">
              "Klik TRUTH atau DARE di bawah buat ambil kartu!"
            </p>
          </div>

          <div class="w-full border-t border-rose-100 pt-2">
            <span id="card-player" class="text-[11px] font-semibold text-rose-400">
              <i class="fa-solid fa-sparkles mr-1"></i> HeartSync Interactive
            </span>
          </div>
        </div>
      </div>

      <!-- Tombol Aksi Utama -->
      <div class="grid grid-cols-2 gap-3 pt-1">
        <button onclick="sendChoice('Truth')" 
          class="py-3 px-4 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl shadow-md shadow-sky-200 transition-all active:scale-95 flex items-center justify-center gap-2">
          <i class="fa-solid fa-scroll"></i> TRUTH
        </button>
        <button onclick="sendChoice('Dare')" 
          class="py-3 px-4 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl shadow-md shadow-rose-200 transition-all active:scale-95 flex items-center justify-center gap-2">
          <i class="fa-solid fa-fire"></i> DARE
        </button>
      </div>

      <!-- Tombol Pass / menyerah -->
      <button onclick="triggerPass()" 
        class="w-full py-2 bg-amber-100 hover:bg-amber-200 text-amber-700 font-bold rounded-xl border border-amber-300 text-xs transition-all active:scale-95 flex items-center justify-center gap-1">
        <i class="fa-solid fa-flag"></i> Ga Berani? (PASS / Hukuman)
      </button>

      <!-- Panel Tambah Kartu Rahasia (Custom Deck) -->
      <div class="pt-3 border-t border-rose-200/60">
        <button onclick="toggleCustomForm()" class="text-xs font-bold text-rose-500 hover:underline flex items-center gap-1 mx-auto">
          <i class="fa-solid fa-plus-circle"></i> Tambah Kartu Rahasia Kamu
        </button>

        <div id="custom-form" class="hidden mt-3 p-3 bg-white/90 rounded-2xl border border-rose-200 space-y-2">
          <div class="flex gap-2">
            <select id="custom-type" class="text-xs p-2 rounded-lg bg-rose-50 border border-rose-200 text-gray-700 font-bold">
              <option value="truth">TRUTH</option>
              <option value="dare">DARE</option>
            </select>
            <input type="text" id="custom-text" placeholder="Tulis pertanyaan/tantangan rahasia..." 
              class="w-full text-xs p-2 rounded-lg bg-rose-50 border border-rose-200 text-gray-700 focus:outline-none">
          </div>
          <button onclick="addCustomCard()" 
            class="w-full py-2 bg-rose-500 text-white font-bold text-xs rounded-lg shadow hover:bg-rose-600 transition-all">
            Simpan Kartu Rahasia
          </button>
        </div>
      </div>

    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
